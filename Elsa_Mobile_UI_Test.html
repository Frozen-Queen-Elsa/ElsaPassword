<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo UI - Điện Thoại (Mobile)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#4A90E2', accent: '#00E5FF' },
                    boxShadow: { 'glow': '0 0 15px rgba(0, 229, 255, 0.4)' }
                }
            }
        }
    </script>
    <style>
        body { 
            background: #1b2735; 
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            color: white; font-family: sans-serif;
        }
        /* Khung giả lập iPhone */
        .phone-frame {
            width: 375px; height: 812px;
            background-image: url('https://images.unsplash.com/photo-1549880181-58079a40590a?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center;
            border-radius: 40px; border: 8px solid #2d3748;
            position: relative; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        /* Tai thỏ (Notch) */
        .notch {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 150px; height: 25px; background: #2d3748;
            border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 50;
        }
        
        .glass-panel {
            background: rgba(10, 20, 40, 0.5); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.2); height: 100%; width: 100%;
            display: flex; flex-direction: column; padding: 24px; padding-top: 60px;
        }
        .elsa-input {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 16px; padding: 16px; width: 100%;
            transition: all 0.3s; margin-bottom: 16px;
        }
        .elsa-input:focus { outline: none; border-color: #00E5FF; box-shadow: 0 0 10px rgba(0,229,255,0.3); }
        .elsa-btn {
            background: linear-gradient(135deg, #4A90E2, #00E5FF);
            padding: 16px; border-radius: 20px; font-weight: bold; width: 100%;
            text-align: center; box-shadow: 0 5px 15px rgba(0,229,255,0.3);
            text-transform: uppercase; letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="notch"></div>
        <div class="glass-panel">
            <div class="text-center mb-10 mt-10">
                <div class="w-20 h-20 mx-auto bg-white/10 rounded-full flex items-center justify-center text-4xl shadow-glow mb-4 border border-cyan-300/50">👑</div>
                <h1 class="text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-300 to-cyan-300">ELSA VAULT</h1>
                <p class="text-xs text-cyan-200 mt-2">MOBILE EDITION</p>
            </div>

            <div class="flex-1">
                <input type="password" class="elsa-input text-center text-xl tracking-widest" placeholder="Mật Khẩu Chủ">
            </div>

            <div class="mb-8">
                <div class="elsa-btn cursor-pointer active:scale-95 transition-transform">
                    Mở Khóa Bằng FaceID
                </div>
            </div>
            
            <!-- Bottom Indicator giả lập -->
            <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/50 rounded-full"></div>
        </div>
    </div>

</body>
</html>
