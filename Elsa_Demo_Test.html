<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elsa Password - WOW Frozen 2 Theme</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        accent: '#00E5FF',
                        iceGlass: 'rgba(255, 255, 255, 0.1)',
                        iceBorder: 'rgba(255, 255, 255, 0.2)'
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 229, 255, 0.4)',
                        'glow-strong': '0 0 30px rgba(0, 229, 255, 0.8)'
                    }
                }
            }
        }
    </script>
    <style>
        /* Phép thuật Kính Băng (Glassmorphism) & Hình nền Sông Băng Ahtohallan */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #E2E8F0;
            background-image: url('https://images.unsplash.com/photo-1549880181-58079a40590a?q=80&w=2070&auto=format&fit=crop'); /* Nền rừng thông tuyết ma mị */
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(10, 15, 30, 0.85); /* Phủ tối để làm nổi bật UI */
        }
        
        .glass-panel {
            background: rgba(20, 30, 50, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .elsa-input { 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease; 
        }
        .elsa-input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .elsa-input:focus { 
            outline: none; 
            border-color: #00E5FF; 
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0px 0px 15px rgba(0, 229, 255, 0.4); 
        }
        
        .elsa-btn { 
            background: linear-gradient(135deg, rgba(74,144,226,0.8), rgba(0,229,255,0.8));
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease; 
        }
        .elsa-btn:hover {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
            transform: translateY(-2px);
        }
        .elsa-btn:active { transform: scale(0.96); }

        /* Hoa tuyết rơi (CSS Animation) */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            opacity: 0.8;
            font-size: 1.2em;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center relative overflow-hidden">

    <!-- Tạo hoa tuyết -->
    <div class="snowflake" style="left: 10%; animation-duration: 10s;">❄</div>
    <div class="snowflake" style="left: 30%; animation-duration: 12s; font-size: 0.8em;">❅</div>
    <div class="snowflake" style="left: 50%; animation-duration: 8s;">❆</div>
    <div class="snowflake" style="left: 70%; animation-duration: 15s; font-size: 1.5em;">❄</div>
    <div class="snowflake" style="left: 90%; animation-duration: 11s;">❅</div>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="screen-login" class="glass-panel p-8 rounded-3xl w-96 relative z-10 text-center">
        <!-- Avatar/Icon giả lập -->
        <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-tr from-blue-400 to-cyan-300 p-1 shadow-glow flex items-center justify-center">
            <span class="text-4xl">👑</span>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wider mb-1" style="text-shadow: 0 0 10px #00E5FF;">ELSA VAULT</h1>
        <p class="text-xs text-cyan-200 mb-8 opacity-80 uppercase tracking-widest">Ma thuật bảo mật tuyệt đối</p>

        <div class="text-left mb-6">
            <input type="password" id="master-pass" class="elsa-input w-full rounded-2xl px-5 py-4 text-lg" placeholder="Nhập Thần Chú (Master Pass)...">
        </div>

        <button onclick="switchScreen()" class="elsa-btn w-full text-white font-bold rounded-full py-4 uppercase tracking-wider">
            MỞ KÉT BĂNG GIÁ
        </button>
    </div>

    <!-- MÀN HÌNH KÉT SẮT -->
    <div id="screen-vault" class="glass-panel p-8 rounded-3xl w-[500px] h-[600px] relative z-10 hidden flex flex-col">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-iceBorder">
            <h1 class="text-xl font-bold text-white" style="text-shadow: 0 0 10px #00E5FF;">ELSA VAULT</h1>
            <button onclick="lockVault()" class="text-xs uppercase tracking-widest text-cyan-300 hover:text-white transition-colors">Khóa Két 🔒</button>
        </div>

        <div class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 scrollbar-hide">
            <!-- Mật khẩu 1 -->
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10 hover:border-cyan-400/50 hover:bg-white/10 transition-all group flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-xl shadow-inner border border-white/10">📘</div>
                    <div>
                        <h4 class="font-bold text-white group-hover:text-cyan-300 transition-colors">Facebook Nữ Hoàng</h4>
                        <p class="text-xs text-gray-400">elsa@arendelle.com</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-sm font-mono bg-black/40 px-3 py-2 rounded-lg border border-white/10 text-cyan-300 blur-[5px] hover:blur-none transition-all cursor-pointer">SnowQueen123!</span>
                </div>
            </div>
            <!-- Mật khẩu 2 -->
            <div class="bg-white/5 p-4 rounded-2xl border border-white/10 hover:border-cyan-400/50 hover:bg-white/10 transition-all group flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-xl shadow-inner border border-white/10">🎮</div>
                    <div>
                        <h4 class="font-bold text-white group-hover:text-cyan-300 transition-colors">Riot Client</h4>
                        <p class="text-xs text-gray-400">nuhoang_lienminh</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-sm font-mono bg-black/40 px-3 py-2 rounded-lg border border-white/10 text-cyan-300 blur-[5px] hover:blur-none transition-all cursor-pointer">IceMagic999</span>
                </div>
            </div>
        </div>

        <!-- Form thêm Pass -->
        <div class="pt-4">
            <div class="flex space-x-2 mb-3">
                <input type="text" class="elsa-input w-1/3 rounded-xl px-3 py-3 text-sm" placeholder="Tên (VD: Zalo)">
                <input type="text" class="elsa-input w-1/3 rounded-xl px-3 py-3 text-sm" placeholder="Tài khoản">
                <div class="w-1/3 flex space-x-1 relative">
                    <input type="text" class="elsa-input w-full rounded-xl px-3 py-3 text-sm" placeholder="Mật khẩu">
                </div>
            </div>
            <button class="elsa-btn w-full text-white font-bold rounded-xl py-3 uppercase tracking-wider text-sm shadow-glow hover:shadow-glow-strong">
                + LƯU VÀO KÉT
            </button>
        </div>
    </div>

    <script>
        function switchScreen() {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-vault').classList.remove('hidden');
        }
        function lockVault() {
            document.getElementById('screen-vault').classList.add('hidden');
            document.getElementById('screen-login').classList.remove('hidden');
            document.getElementById('master-pass').value = '';
        }
    </script>
</body>
</html>
